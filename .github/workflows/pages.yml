name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      VITE_APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
      VITE_APPWRITE_TRENDS_FUNCTION_ID: movie-trends
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - run: npm ci
      - name: Verify deployed movie service
        run: |
          node --input-type=module <<'JS'
          import { Client, ExecutionMethod, Functions } from 'appwrite';

          const project = process.env.VITE_APPWRITE_PROJECT_ID;
          if (!project) throw new Error('Set the APPWRITE_PROJECT_ID repository variable');

          const client = new Client().setEndpoint('https://fra.cloud.appwrite.io/v1').setProject(project);
          const functions = new Functions(client);
          for (const path of ['/discover/movie', '/trends?period=all', '/trends?period=daily']) {
            const execution = await functions.createExecution(
              process.env.VITE_APPWRITE_TRENDS_FUNCTION_ID, '', false, path, ExecutionMethod.GET,
            );
            if (execution.responseStatusCode !== 200) {
              throw new Error(`Appwrite request ${path} returned ${execution.responseStatusCode}`);
            }
          }
          JS
      - run: npm run build -- --mode pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
